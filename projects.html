<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11100f">
<meta name="description" content="Visual project gallery by Vansh Ru.">
<title>Project gallery | Vansh Ru</title>
<style>
*{box-sizing:border-box}
html{background:#11100f}
body{margin:0;padding:14px;background:#11100f}
.gallery{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-flow:dense;gap:12px;max-width:1800px;margin:0 auto}
.tile{grid-column:span 6;display:block;width:100%;padding:0;border:0;background:#201f1c;overflow:hidden;cursor:zoom-in}
.tile.wide{grid-column:span 12}
.tile.third{grid-column:span 4}
.tile img,.tile video{display:block;width:100%;height:100%;aspect-ratio:16/10;object-fit:cover;transition:filter .2s ease}
.tile:hover img,.tile:hover video{filter:brightness(.9)}
.tile:focus-visible{outline:2px solid #d85a37;outline-offset:2px}
.viewer{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:rgba(12,12,11,.97);overflow:hidden}
.viewer::backdrop{background:rgba(12,12,11,.96)}
.viewer-media{display:grid;width:100%;height:100%;place-items:center}
.viewer-media img,.viewer-media video{display:block;max-width:94vw;max-height:92vh;object-fit:contain}
@media(max-width:760px){body{padding:8px}.gallery{gap:8px}.tile,.tile.third{grid-column:span 6}.tile.wide{grid-column:span 12}}
@media(max-width:480px){.gallery{gap:6px}.tile,.tile.third,.tile.wide{grid-column:span 12}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="gallery" aria-label="Project artwork">
  <button class="tile wide" type="button" aria-label="Open Music in motion artwork"><video src="assets/screensaver-test.mp4" autoplay muted loop playsinline preload="metadata" aria-label="Music-reactive Unreal Engine screensaver"></video></button>
  <button class="tile wide" type="button" aria-label="Open Nuketown: Overgrown final render"><img src="assets/nuketown-render.png" alt="Surreal, overgrown suburban map environment" fetchpriority="high"></button>
  <button class="tile third" type="button" aria-label="Open Nuketown: Overgrown alternate view"><img src="assets/nuketown-concept.png" alt="Alternate concept view of Nuketown: Overgrown" loading="lazy"></button>
  <button class="tile third" type="button" aria-label="Open Nuketown: Overgrown blockout"><img src="assets/nuketown-blockout.png" alt="Environment blockout for Nuketown: Overgrown" loading="lazy"></button>
  <button class="tile third" type="button" aria-label="Open Dream Atlas artwork"><img src="assets/dream-render.jpg" alt="Quiet sunlit interior rebuilt from a remembered dream" loading="lazy"></button>
  <button class="tile wide" type="button" aria-label="Open One take, handheld cinematic"><video src="assets/rdr-cinematic.mp4" autoplay muted loop playsinline preload="metadata" aria-label="One-take handheld cinematic"></video></button>
  <button class="tile wide" type="button" aria-label="Open indie game intro"><video src="assets/indie-cinematic.mp4" autoplay muted loop playsinline preload="metadata" aria-label="Retro-inspired indie game cinematic"></video></button>
</main>
<dialog class="viewer" aria-label="Project artwork preview">
  <div class="viewer-media" id="viewerMedia"></div>
</dialog>
<script>
const tiles=[...document.querySelectorAll(".tile")],viewer=document.querySelector(".viewer"),mediaBox=document.querySelector("#viewerMedia");let active=0;
function showItem(index){active=(index+tiles.length)%tiles.length;const source=tiles[active].querySelector("img,video"),copy=source.cloneNode(true);copy.removeAttribute("loading");copy.removeAttribute("autoplay");copy.removeAttribute("loop");if(copy.tagName==="VIDEO"){copy.controls=true;copy.muted=true;copy.playsInline=true}mediaBox.replaceChildren(copy);if(copy.tagName==="VIDEO")copy.play().catch(()=>{})}
tiles.forEach((tile,index)=>tile.addEventListener("click",()=>{showItem(index);viewer.showModal()}));
viewer.addEventListener("click",event=>{if(event.target===viewer)viewer.close()});viewer.addEventListener("close",()=>mediaBox.replaceChildren());document.addEventListener("keydown",event=>{if(!viewer.open)return;if(event.key==="ArrowLeft")showItem(active-1);if(event.key==="ArrowRight")showItem(active+1)});
</script>
</body>
</html>
